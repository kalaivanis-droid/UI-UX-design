<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#e74c3c" filter="url(#glow)" opacity="0.8">TEXT GLOW</text>
  <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Glowing neon text effect</text>
</svg>
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#00ffff" filter="url(#electric)" stroke="#0080ff" stroke-width="0.5">ELECTRIC</text>
  <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Electric surge</text>
</svg>
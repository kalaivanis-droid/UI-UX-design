<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cyber">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="10" y="60" width="300" height="80" fill="none" stroke="#00ff00" stroke-width="2" rx="5"/>
  <text x="20" y="100" font-family="monospace" font-size="50" font-weight="bold" fill="#00ff00" filter="url(#cyber)">CYBER</text>
  <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Cyber tech style</text>
</svg>
<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hologram">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="none" stroke="#00ffff" stroke-width="1.5" filter="url(#hologram)" opacity="0.8">HOLO</text>
  <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Holographic effect</text>
</svg>
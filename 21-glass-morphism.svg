<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>
  <rect x="10" y="60" width="300" height="80" fill="#fff" opacity="0.15" rx="10" backdrop-filter="blur(10px)"/>
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#2c3e50" filter="url(#glass)">GLASS</text>
  <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Glassmorphism effect</text>
</svg>
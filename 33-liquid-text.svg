<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="liquid">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" />
    </filter>
  </defs>
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#3498db" filter="url(#liquid)">LIQUID</text>
  <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Liquid distortion</text>
</svg>
<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="4" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#2c3e50" filter="url(#shadow)">DROP SHADOW</text>
  <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Text with drop shadow effect</text>
</svg>
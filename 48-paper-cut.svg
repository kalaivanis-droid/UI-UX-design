<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="paper">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="20" y="100" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#paper)">PAPER</text>
  <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Paper cut effect</text>
</svg>